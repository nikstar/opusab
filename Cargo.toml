[package]
name = "opusab"
version = "0.2.0"
edition = "2024"
description = "Prepare, convert, and edit audiobooks from a terminal"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = "0.28"
ctrlc = "3.4"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
natord = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-width = "0.2"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true
